<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - DistriMax</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-box">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="color: var(--accent-blue); font-size: 1.75rem; margin-bottom: 0.5rem;">🌐 DistriMax</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Internal MaxMind MMDB Distribution Server</p>
    </div>

    {{if .Error}}
      <div class="flash-banner flash-error" style="margin-bottom: 1.5rem;">
        <span>✕ {{.Error}}</span>
      </div>
    {{end}}
    {{if .Success}}
      <div class="flash-banner flash-success" style="margin-bottom: 1.5rem;">
        <span>✓ {{.Success}}</span>
      </div>
    {{end}}

    <form action="/login" method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autofocus placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">Sign In</button>
    </form>

    <div style="margin-top: 2rem; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
      Locked out? Use break-glass recovery with <span class="code-inline">POST /recover</span>
    </div>
  </div>
</body>
</html>
