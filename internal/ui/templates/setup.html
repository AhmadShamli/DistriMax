<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Initial Setup - DistriMax</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-box">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="color: var(--accent-blue); font-size: 1.75rem; margin-bottom: 0.5rem;">🌐 DistriMax Setup</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">First-deployment administrator initialization</p>
    </div>

    {{if .Error}}
      <div class="flash-banner flash-error" style="margin-bottom: 1.5rem;">
        <span>✕ {{.Error}}</span>
      </div>
    {{end}}

    <form action="/setup" method="POST">
      <div class="form-group">
        <label>Bootstrap Secret (from DISTRIMAX_BOOTSTRAP_SECRET)</label>
        <input type="password" name="bootstrap_secret" required placeholder="Enter bootstrap secret">
      </div>
      <div class="form-group">
        <label>Initial Administrator Username</label>
        <input type="text" name="username" required placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password (min 8 characters)</label>
        <input type="password" name="password" required minlength="8">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">Initialize DistriMax</button>
    </form>
  </div>
</body>
</html>
